# Netlify builds the site from site/ into dist/ with build.py (Python standard library only).
[build]
  command = "python3 build.py --check"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.12"
  # GoatCounter site code, e.g. "urowoman" for https://urowoman.goatcounter.com.
  # Counting runs only on the production (main) deploy, never on branch previews.
  GOATCOUNTER_CODE = ""
  # Google Apps Script web app URL that stores consented, anonymous survey answers
  # (see survey/README.md). Leave empty to keep the survey block hidden.
  SURVEY_ENDPOINT = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/assets/*"
  [headers.values]
    # Asset URLs carry a content hash (?v=...), so they can be cached for a long time.
    Cache-Control = "public, max-age=31536000, immutable"
